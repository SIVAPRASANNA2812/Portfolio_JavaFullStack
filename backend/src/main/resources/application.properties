# ============================================================================
# SIVA PRASANNA - SPRING BOOT PORTFOLIO CONFIGURATION
# ============================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=portfolio-backend

# ----------------------------------------------------------------------------
# In-Memory H2 Database Configuration (Default: Zero setup required)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ----------------------------------------------------------------------------
# MySQL Configuration (Uncomment to use local MySQL database instead of H2)
# ----------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_fsd?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------------------------------
# Hibernate & JPA Properties
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.web=INFO
